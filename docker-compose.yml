# The bot and its Postgres database. Locally: put the values in .env and run `docker compose up -d`.
# On Coolify: pick the Docker Compose build pack and fill in the variables it lists.
services:
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fmbotg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/fmbotg
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN}
      LASTFM_API_KEY: ${LASTFM_API_KEY:?set LASTFM_API_KEY}
      LASTFM_API_SECRET: ${LASTFM_API_SECRET:?set LASTFM_API_SECRET}
      LASTFM_PRIVATE_KEY: ${LASTFM_PRIVATE_KEY:-}
      LASTFM_RATE_LIMIT: ${LASTFM_RATE_LIMIT:-5}
      WHOKNOWS_MAX_MEMBERS: ${WHOKNOWS_MAX_MEMBERS:-100}
      FM_ALIASES: ${FM_ALIASES:-}
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      JUDGE_DAILY_LIMIT: ${JUDGE_DAILY_LIMIT:-5}
      BOT_OWNER_IDS: ${BOT_OWNER_IDS:-}
      PYTHONUNBUFFERED: "1"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fmbotg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: fmbotg
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmbotg -d fmbotg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
