[project]
name = "fmbot-tg"
version = "0.1.0"
description = "Python/Telegram port of FMBot: Last.fm statistics for Telegram chats"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pillow>=10.3",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "tzdata>=2024.1",
]

[dependency-groups]
# Installed by `uv sync` by default
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyflakes>=3"]

[project.scripts]
fmbot-tg = "fmbot_tg.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fmbot_tg*"]

[tool.setuptools.package-data]
fmbot_tg = ["migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
